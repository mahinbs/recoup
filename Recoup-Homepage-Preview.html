<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Functional Medicine &amp; Chronic Pain Rehabilitation in Bangalore | Recoup Health (Preview)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;600;700&display=swap" rel="stylesheet">
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
:root {
  --green-900: #38126d;   /* deep purple (hero/footer dark) */
  --green-800: #5b21b6;   /* dark purple */
  --green-600: #862cd6;   /* primary brand purple */
  --green-100: #f3e8ff;   /* light purple tint */
  --gold: #d8b4fe;        /* light lavender accent (on dark) */
  --ink: #1f2937;
  --muted: #6b7280;
  --bg: #f9fafb;
  --card: #ffffff;
  --radius: 14px;
  --shadow: 0 6px 24px rgba(134, 44, 214, 0.10);
  --font-display: 'Ubuntu', system-ui, sans-serif;
  --font-body: 'Ubuntu', system-ui, sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  font-family: var(--font-body);
  color: var(--ink);
  background: var(--bg);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

img { max-width: 100%; display: block; }

.container { width: min(1160px, 92%); margin: 0 auto; }

section { padding: 72px 0; }

h1, h2, h3 { font-family: var(--font-display); line-height: 1.15; font-weight: 600; }

.kicker {
  display: inline-block;
  font-size: 0.78rem;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--green-600);
  margin-bottom: 14px;
}

.section-title { font-size: clamp(1.7rem, 3.5vw, 2.4rem); margin-bottom: 12px; }
.section-sub { color: var(--muted); max-width: 640px; }

.btn {
  display: inline-block;
  padding: 14px 28px;
  border-radius: 999px;
  font-weight: 600;
  font-size: 0.95rem;
  text-decoration: none;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
  cursor: pointer;
  border: none;
}
.btn:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.btn-primary { background: var(--green-600); color: #fff; }
.btn-secondary { background: transparent; color: var(--green-800); border: 2px solid var(--green-800); }
.btn-gold { background: #ffffff; color: var(--green-800); }

/* Nav */
.nav {
  position: sticky; top: 0; z-index: 50;
  background: rgba(255, 255, 255, 0.92);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid rgba(134, 44, 214, 0.10);
}
.nav-inner { display: flex; align-items: center; justify-content: space-between; height: 72px; }
.nav-logo { font-family: var(--font-display); font-size: 1.35rem; color: var(--green-900); text-decoration: none; font-weight: 600; }
.nav-logo span { color: var(--gold); }
.nav-links { display: flex; gap: 26px; list-style: none; }
.nav-links a { text-decoration: none; color: var(--ink); font-size: 0.92rem; font-weight: 500; }
.nav-links a:hover { color: var(--green-600); }
.nav-toggle { display: none; background: none; border: none; font-size: 1.6rem; color: var(--green-900); cursor: pointer; }

/* Hero */
.hero {
  position: relative;
  overflow: hidden;
  background: linear-gradient(180deg, #faf7ff 0%, #f5eefc 55%, #f1e8fa 100%);
  padding: 90px 0 100px;
}
.hero-grid { display: grid; grid-template-columns: 1.05fr 0.95fr; gap: 40px; align-items: center; }

.hero-content { max-width: 640px; order: 1; }
.hero-figure { order: 2; }
.hero-badge {
  display: inline-block;
  background: #ffffff;
  border: 1px solid rgba(134,44,214,0.25);
  color: var(--green-800);
  font-size: 0.82rem;
  font-weight: 500;
  padding: 7px 16px;
  border-radius: 999px;
  margin-bottom: 22px;
  box-shadow: 0 2px 10px rgba(134,44,214,0.08);
}
.hero h1 {
  font-size: clamp(2.1rem, 4.4vw, 3.2rem);
  color: #111827;
  font-weight: 700;
  margin-bottom: 22px;
}
.hero h1 em {
  font-style: normal;
  background: linear-gradient(90deg, #862cd6, #a665e4);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.hero-sub { font-size: 1.02rem; color: #374151; margin-bottom: 16px; }
.hero-sub strong, .hero-support strong { color: #111827; font-weight: 700; }
.hero-support { font-size: 0.93rem; color: #4b5563; margin-bottom: 32px; }
.hero-ctas { display: flex; gap: 16px; flex-wrap: wrap; }
.btn-outline {
  background: #ffffff;
  color: #1f2937;
  border: 1px solid #d1d5db;
}

/* Doctor figure — large, unframed, badges floating around */
.hero-figure {
  position: relative;
  width: 100%;
  max-width: 560px;
  justify-self: end;
}
.hero-figure > img {
  width: 100%;
  height: auto;
  display: block;
  transform: scaleX(-1);
  filter: drop-shadow(0 18px 40px rgba(134,44,214,0.18));
  -webkit-mask-image: linear-gradient(180deg, #000 86%, transparent 99%);
  mask-image: linear-gradient(180deg, #000 86%, transparent 99%);
}
.float-badge {
  position: absolute;
  background: rgba(255,255,255,0.95);
  border: 1px solid rgba(134,44,214,0.22);
  border-radius: 12px;
  padding: 8px 12px;
  box-shadow: 0 6px 18px rgba(134,44,214,0.16);
  text-align: center;
  max-width: 170px;
}
.float-badge {
  animation: badge-in 0.6s ease backwards, badge-float 4s ease-in-out infinite;
}
.float-badge:nth-child(2) { animation-delay: 0.10s, 0.0s; }
.float-badge:nth-child(3) { animation-delay: 0.25s, 0.6s; }
.float-badge:nth-child(4) { animation-delay: 0.40s, 1.2s; }
.float-badge:nth-child(5) { animation-delay: 0.55s, 1.8s; }
.float-badge:nth-child(6) { animation-delay: 0.70s, 2.4s; }
.float-badge:nth-child(7) { animation-delay: 0.85s, 3.0s; }
@keyframes badge-in {
  from { opacity: 0; transform: translateY(14px) scale(0.92); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes badge-float {
  0%, 100% { translate: 0 0; }
  50%      { translate: 0 -7px; }
}
@media (prefers-reduced-motion: reduce) {
  .float-badge { animation: none; }
}
.float-badge strong { display: block; font-size: 0.78rem; color: var(--green-800); line-height: 1.25; }
.float-badge span { font-size: 0.68rem; color: var(--muted); }
.b-tl { top: 4%; left: -6%; }
.b-tr { top: 10%; right: -4%; }
.b-ml { top: 40%; left: -10%; }
.b-mr { top: 48%; right: -8%; }
.b-bl { bottom: 8%; left: -4%; }
.b-br { bottom: 3%; right: -2%; }

@media (max-width: 900px) {
  .hero-figure { max-width: 440px; margin: 24px auto 0; justify-self: center; }
  .b-tl { left: 0; } .b-ml { left: 0; } .b-bl { left: 0; }
  .b-tr { right: 0; } .b-mr { right: 0; } .b-br { right: 0; }
}

@media (max-width: 560px) {
  .hero-figure { max-width: 100%; }
  .float-badge { position: static; display: inline-block; margin: 4px; max-width: none; }
  .hero-figure { text-align: center; }
}

/* Trust bar */
.trustbar { padding: 28px 0; background: var(--card); border-bottom: 1px solid rgba(134,44,214,0.08); }
.trustbar-inner { display: flex; align-items: center; justify-content: center; gap: 40px; flex-wrap: wrap; color: var(--muted); font-size: 0.9rem; }
.trustbar-inner strong { color: var(--green-800); }

/* Cards */
.card-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin-top: 40px; }
.card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 28px;
  box-shadow: var(--shadow);
  border: 1px solid rgba(134,44,214,0.07);
}
.card .icon { font-size: 1.6rem; margin-bottom: 14px; }
.card h3 { font-size: 1.15rem; margin-bottom: 8px; }
.card p { color: var(--muted); font-size: 0.92rem; }
.card a { color: var(--green-600); font-weight: 600; font-size: 0.88rem; text-decoration: none; display: inline-block; margin-top: 12px; }

/* Stats */
.stats { background: var(--green-900); color: #fff; }
.stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; text-align: center; }
.stat-value { font-family: var(--font-display); font-size: clamp(2.2rem, 5vw, 3.2rem); color: var(--gold); }
.stat-label { color: rgba(255,255,255,0.75); font-size: 0.95rem; margin-top: 6px; }

/* FourR */
.fourr-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-top: 40px; }
.fourr-step {
  position: relative;
  background: var(--card);
  border-radius: var(--radius);
  padding: 26px;
  box-shadow: var(--shadow);
  overflow: hidden;
  transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.35s ease;
}
.fourr-step::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 4px;
  background: linear-gradient(90deg, #862cd6, #a665e4, #d8b4fe);
  transform: scaleX(0);
  transform-origin: left;
  transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
}
.fourr-step::after {
  content: '';
  position: absolute;
  top: 0; bottom: 0;
  width: 60%;
  left: -80%;
  background: linear-gradient(105deg, transparent, rgba(166,101,228,0.12), transparent);
  transform: skewX(-18deg);
  animation: card-sheen 5.5s ease-in-out infinite;
}
.fourr-step:nth-child(1)::after { animation-delay: 0s; }
.fourr-step:nth-child(2)::after { animation-delay: 0.7s; }
.fourr-step:nth-child(3)::after { animation-delay: 1.4s; }
.fourr-step:nth-child(4)::after { animation-delay: 2.1s; }
@keyframes card-sheen {
  0%, 55%, 100% { left: -80%; }
  25% { left: 120%; }
}
.fourr-step .num { position: relative; display: inline-block; }
.fourr-step .num::before {
  content: '';
  position: absolute;
  inset: -10px -14px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(134,44,214,0.16), transparent 70%);
  animation: num-breathe 3s ease-in-out infinite;
  z-index: -1;
}
@keyframes num-breathe {
  0%, 100% { transform: scale(0.85); opacity: 0.6; }
  50% { transform: scale(1.25); opacity: 1; }
}
.fourr-step:hover { transform: translateY(-8px); box-shadow: 0 18px 40px rgba(134,44,214,0.22); }
.fourr-step:hover::before { transform: scaleX(1); }
/* staggered entrance when section scrolls into view */
.reveal.visible .fourr-step { animation: card-rise 0.65s cubic-bezier(0.22, 1, 0.36, 1) backwards; }
.reveal.visible .fourr-step:nth-child(1) { animation-delay: 0.05s; }
.reveal.visible .fourr-step:nth-child(2) { animation-delay: 0.18s; }
.reveal.visible .fourr-step:nth-child(3) { animation-delay: 0.31s; }
.reveal.visible .fourr-step:nth-child(4) { animation-delay: 0.44s; }
@keyframes card-rise {
  from { opacity: 0; transform: translateY(28px) scale(0.96); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
@media (prefers-reduced-motion: reduce) {
  .reveal.visible .fourr-step { animation: none; }
  .fourr-step:hover { transform: none; }
  .fourr-step::after, .fourr-step .num::before { animation: none; }
}
.fourr-step .num {
  font-family: var(--font-display);
  font-size: 1.5rem;
  font-weight: 700;
  background: linear-gradient(90deg, #862cd6, #a665e4);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.fourr-step h3 { margin: 8px 0 6px; font-size: 1.2rem; }
.fourr-step p { color: var(--muted); font-size: 0.9rem; }

/* Founder */
.founder { background: var(--green-100); padding: 96px 0; }
.founder-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 56px; align-items: center; }

.founder-lead {
  font-size: 1.02rem;
  line-height: 1.65;
  color: #3a3346;
  margin: 18px 0 30px;
}

.founder-stat-strip {
  display: flex;
  gap: 28px;
  flex-wrap: wrap;
  padding-top: 24px;
  border-top: 1px solid rgba(134,44,214,0.18);
}
.stat-strip-item strong {
  display: block;
  font-family: var(--font-display);
  font-size: 1.15rem;
  color: var(--green-800);
  margin-bottom: 4px;
}
.stat-strip-item span { font-size: 0.8rem; color: var(--muted); line-height: 1.4; max-width: 160px; display: block; }

.founder-gallery { position: relative; }

.founder-float-badge {
  position: absolute;
  top: -18px; right: 18px;
  z-index: 3;
  background: #fff;
  border-radius: 14px;
  padding: 10px 16px;
  font-weight: 700;
  font-size: 0.88rem;
  color: var(--green-800);
  box-shadow: 0 12px 28px rgba(134,44,214,0.24);
  display: flex;
  align-items: center;
  gap: 8px;
  transform: rotate(2deg);
}
.founder-float-badge small {
  display: block;
  font-weight: 500;
  color: var(--muted);
  font-size: 0.7rem;
  margin-left: 4px;
}

.founder-photo-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}

.achv-card {
  position: relative;
  border-radius: 20px;
  overflow: hidden;
  aspect-ratio: 1 / 1;
  box-shadow: var(--shadow);
  transition: transform 0.3s cubic-bezier(0.22,1,0.36,1), box-shadow 0.3s ease;
}
.achv-card:hover { transform: translateY(-5px); box-shadow: 0 18px 40px rgba(134,44,214,0.22); }
.achv-bg {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: center;
  filter: saturate(1.05);
}
.achv-bg-tint {
  filter: grayscale(0.35) sepia(0.25) hue-rotate(220deg) saturate(1.8);
}
.achv-scrim {
  position: absolute;
  inset: 0;
  background: linear-gradient(0deg, rgba(20,8,38,0.88) 0%, rgba(20,8,38,0.25) 55%, rgba(20,8,38,0.15) 100%);
}
.achv-content {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  padding: 16px;
  color: #fff;
}
.achv-emoji { font-size: 1.2rem; display: block; margin-bottom: 4px; }
.achv-content strong { display: block; font-size: 0.92rem; margin-bottom: 4px; }
.achv-content p { font-size: 0.74rem; line-height: 1.35; color: rgba(255,255,255,0.85); }

/* Testimonials */
.testimonial-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin-top: 40px; }
.testimonial { background: var(--card); border-radius: var(--radius); padding: 26px; box-shadow: var(--shadow); font-size: 0.92rem; }
.testimonial p { color: var(--ink); font-style: italic; }
.testimonial footer { margin-top: 16px; color: var(--muted); font-size: 0.85rem; }
.testimonial footer strong { color: var(--green-800); display: block; font-style: normal; }

/* Final CTA */
.final-cta { background: linear-gradient(160deg, var(--green-800), var(--green-900)); color: #fff; text-align: center; border-radius: var(--radius); padding: 64px 32px; }
.final-cta h2 { color: #fff; font-size: clamp(1.6rem, 3vw, 2.2rem); margin-bottom: 12px; }
.final-cta p { color: rgba(255,255,255,0.8); max-width: 560px; margin: 0 auto 28px; }

/* Footer */
.footer { background: var(--green-900); color: rgba(255,255,255,0.8); padding: 56px 0 28px; margin-top: 72px; }
.footer-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 40px; }
.footer h4 { color: #fff; font-size: 0.95rem; margin-bottom: 14px; }
.footer ul { list-style: none; }
.footer li { margin-bottom: 8px; }
.footer a { color: rgba(255,255,255,0.75); text-decoration: none; font-size: 0.9rem; }
.footer a:hover { color: var(--gold); }
.footer-bottom { border-top: 1px solid rgba(255,255,255,0.12); margin-top: 40px; padding-top: 22px; font-size: 0.82rem; text-align: center; color: rgba(255,255,255,0.5); }

/* WhatsApp float */
.wa-float {
  position: fixed; right: 22px; bottom: 22px; z-index: 60;
  background: #25d366; color: #fff; width: 56px; height: 56px;
  border-radius: 50%; display: flex; align-items: center; justify-content: center;
  font-size: 1.7rem; text-decoration: none; box-shadow: 0 8px 20px rgba(0,0,0,0.25);
}

/* Reveal animation — CSS only, respects reduced motion */
.reveal { opacity: 0; transform: translateY(16px); transition: opacity 0.5s ease, transform 0.5s ease; }
.reveal.visible { opacity: 1; transform: none; }

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .reveal { opacity: 1; transform: none; transition: none; }
  .btn:hover { transform: none; }
}

@media (max-width: 900px) {
  .hero-grid, .founder-grid { grid-template-columns: 1fr; }
  .founder-float-badge { position: static; transform: none; display: inline-flex; margin-bottom: 16px; }
  .founder-stat-strip { gap: 20px; }
  .card-grid, .testimonial-grid { grid-template-columns: 1fr 1fr; }
  .fourr-grid { grid-template-columns: 1fr 1fr; }
  .footer-grid { grid-template-columns: 1fr 1fr; }
  .nav-links {
    display: none;
    position: absolute; top: 72px; left: 0; right: 0;
    background: var(--bg); flex-direction: column; padding: 20px 6%;
    border-bottom: 1px solid rgba(134,44,214,0.12);
  }
  .nav-links.open { display: flex; }
  .nav-toggle { display: block; }
  .nav-cta { display: none; }
}

@media (max-width: 560px) {
  .card-grid, .testimonial-grid, .fourr-grid, .stats-grid, .footer-grid { grid-template-columns: 1fr; }
  section { padding: 52px 0; }
}

/* ============ Why Choose Us — Apple-inspired Liquid Glass ============ */
.wc-section {
  position: relative;
  padding: 88px 0;
  overflow: hidden;
  background: linear-gradient(180deg, #f7f2fd 0%, #f1e9fb 100%);
}

.wc-columns {
  position: relative;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 56px;
  margin-bottom: 8px;
}
.wc-col .section-title { margin-bottom: 0; }

.wc-stage {
  position: relative;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 32px;
  margin-top: 28px;
  align-items: stretch;
}
.wc-stage-col {
  position: relative;
  display: flex;
  align-items: stretch;
  border-radius: 32px;
  overflow: hidden;
  padding: 26px 18px;
  background-size: cover;
  background-position: center;
  isolation: isolate;
  perspective: 1600px;
}
.wc-stage-scrim {
  position: absolute;
  inset: 0;
  background: linear-gradient(165deg, rgba(56,18,109,0.62), rgba(134,44,214,0.38));
  z-index: 0;
}
.wc-stage-col > .glass-card { position: relative; z-index: 1; }

/* --- Liquid glass card --- */
.glass-card {
  position: relative;
  flex: 1;
  display: flex;
  flex-direction: column;
  border-radius: 28px;
  padding: 34px 30px 30px;
  overflow: hidden;
  isolation: isolate;
  background: linear-gradient(150deg, rgba(255,255,255,0.62), rgba(255,255,255,0.28));
  backdrop-filter: blur(22px) saturate(180%);
  -webkit-backdrop-filter: blur(22px) saturate(180%);
  border: 1px solid rgba(255,255,255,0.55);
  box-shadow:
    0 20px 50px rgba(88,28,135,0.16),
    0 2px 8px rgba(88,28,135,0.08),
    inset 0 1px 1px rgba(255,255,255,0.75),
    inset 0 -1px 12px rgba(134,44,214,0.06);
  transform-style: preserve-3d;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  transform: rotateX(var(--tilt-x, 0deg)) rotateY(var(--tilt-y, 0deg));
  transition: transform 0.32s cubic-bezier(0.22,1,0.36,1), opacity 0.32s ease, box-shadow 0.3s ease;
}
.glass-card:hover {
  box-shadow:
    0 26px 60px rgba(88,28,135,0.22),
    0 4px 10px rgba(88,28,135,0.10),
    inset 0 1px 1px rgba(255,255,255,0.85),
    inset 0 -1px 14px rgba(134,44,214,0.09);
  transform: rotateX(var(--tilt-x, 0deg)) rotateY(var(--tilt-y, 0deg)) translateY(-4px);
}
.glass-card.sf-out {
  transition: transform 0.34s cubic-bezier(0.4,0,0.2,1), opacity 0.28s ease;
  transform: rotateY(-98deg) scale(0.92);
  opacity: 0;
}
.glass-card.sf-in-start {
  transition: none;
  transform: rotateY(98deg) scale(0.92);
  opacity: 0;
}

/* specular highlight that follows the cursor, like light catching glass */
.glass-highlight {
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at var(--glow-x, 28%) var(--glow-y, 15%), rgba(255,255,255,0.6), rgba(255,255,255,0) 42%);
  pointer-events: none;
  z-index: 0;
  transition: background 0.15s ease;
}

.glass-ghost-num {
  position: absolute;
  top: -6px; right: 14px;
  font-family: var(--font-display);
  font-size: 6.5rem;
  font-weight: 700;
  color: rgba(134,44,214,0.10);
  line-height: 1;
  z-index: 0;
  user-select: none;
}

.glass-icon-orb {

  display: flex; align-items: center; justify-content: center;
  color: var(--green-800);
  background: linear-gradient(150deg, rgba(255,255,255,0.85), rgba(219,196,247,0.55));
  border: 1px solid rgba(255,255,255,0.7);
  box-shadow: 0 6px 16px rgba(134,44,214,0.18), inset 0 1px 2px rgba(255,255,255,0.9);
  margin-bottom: 18px;
}
.glass-icon-orb svg { width: 27px; height: 27px; }

.glass-card h4 {
  position: relative;
  z-index: 1;
  font-family: var(--font-display);
  font-size: 1.28rem;
  font-weight: 700;
  color: #211435;

.glass-timeline {

}

  font-size: 0.9rem;
  line-height: 1.5;
  color: #4a4159;
}
.glass-timeline li::before {
  content: '';
  position: absolute;
  left: 0; top: 5px;
  width: 8px; height: 8px;
  border-radius: 50%;
  background: linear-gradient(135deg, #862cd6, #a665e4);
  box-shadow: 0 0 0 3px rgba(134,44,214,0.14);
}
.glass-timeline li::after {
  content: '';
  position: absolute;
  left: 3.5px; top: 15px;
  bottom: -1px;
  width: 1.5px;
  background: linear-gradient(180deg, rgba(134,44,214,0.35), rgba(134,44,214,0.05));
}
.glass-timeline li:last-child { padding-bottom: 0; }
.glass-timeline li:last-child::after { display: none; }

/* fills leftover vertical space with a large, faint watermark of the

.glass-fill {
  flex: 1;
  position: relative;
  min-height: 20px;
  z-index: 0;
}
.glass-fill svg {
  position: absolute;
  right: -14px;
  bottom: -14px;
  width: 150px;
  height: 150px;
  opacity: 0.07;
  color: #862cd6;
  transform: rotate(-8deg);
}

/* --- Navigation --- */
.wc-nav {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 18px;
  margin-top: 34px;
}
.wc-arrow {
  width: 42px; height: 42px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  background: rgba(255,255,255,0.7);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.6);
  color: var(--green-800);
  box-shadow: 0 6px 16px rgba(134,44,214,0.14);
  cursor: pointer;
  transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
}
.wc-arrow:hover { transform: translateY(-2px); background: #fff; box-shadow: 0 10px 22px rgba(134,44,214,0.22); }
.wc-arrow:active { transform: translateY(0) scale(0.94); }

.wc-dots { display: flex; gap: 8px; }
.wc-dot {
  width: 9px; height: 9px;
  border-radius: 50%;
  border: none;
  padding: 0;
  background: rgba(134,44,214,0.25);
  cursor: pointer;
  transition: all 0.3s ease;
}
.wc-dot:hover { background: rgba(134,44,214,0.45); }
.wc-dot.active {
  width: 26px;
  border-radius: 6px;
  background: linear-gradient(90deg, #862cd6, #a665e4);
}

@media (max-width: 900px) {
  .wc-columns { grid-template-columns: 1fr; gap: 32px; text-align: center; }

.treat-section { padding: 88px 0; }

.treat-vlabel {
  position: absolute;
  left: 24px;

  font-size: 1rem;
  letter-spacing: 0.01em;

@media (max-width: 900px) {

/* ============ 5-Step Healing Journey ============ */
.journey-section { padding: 96px 0 88px; }
.journey-track {
  position: relative;
  display: flex;
  gap: 8px;
  margin-top: 52px;
}
.journey-line {
  position: absolute;
  left: 5%; right: 5%;
  top: 34px;
  height: 2px;
  background: linear-gradient(90deg, rgba(134,44,214,0.12), rgba(134,44,214,0.45) 10%, rgba(134,44,214,0.45) 90%, rgba(134,44,214,0.12));
  transform-origin: left center;
  transform: scaleX(0);
}
.reveal.visible .journey-line {
  animation: jr-draw 1s cubic-bezier(0.22,1,0.36,1) forwards;
  animation-delay: 0.1s;
}
@keyframes jr-draw { to { transform: scaleX(1); } }

.journey-step {
  position: relative;
  flex: 1;
  text-align: center;
  padding: 0 10px;
  opacity: 0;

  animation: jr-rise 0.5s cubic-bezier(0.22,1,0.36,1) forwards;
  animation-delay: calc(0.25s + var(--i) * 0.1s);

@keyframes jr-rise {
  from { opacity: 0; transform: translateY(16px); }

  box-shadow: 0 14px 30px rgba(134,44,214,0.24);

  position: absolute;

  font-size: 1rem;
  z-index: 1;
}

@media (max-width: 900px) {

/* ---- components/useReveal.js ---- */
const useReveal = (function() {

// Adds .visible when the element scrolls into view. One observer per element,
// disconnects after firing — no continuous work on the main thread.
function useReveal() {
  const ref = useRef(null)
  useEffect(() => {
    const el = ref.current
    if (!el) return
    if (!('IntersectionObserver' in window)) {
      el.classList.add('visible')
      return
    }
    const io = new IntersectionObserver(
      (entries) => {
        entries.forEach((e) => {
          if (e.isIntersecting) {
            e.target.classList.add('visible')
            io.disconnect()
          }
        })
      },
      { threshold: 0.15 },
    )
    io.observe(el)
    return () => io.disconnect()
  }, [])
  return ref
}

return useReveal;
})();

function GlassCard({ card, index, phase }) {
  const cardRef = useRef(null)
  const rafRef = useRef(null)
  const reducedRef = useRef(false)

  useEffect(() => {
    reducedRef.current = window.matchMedia('(prefers-reduced-motion: reduce)').matches
  }, [])

  const handleMove = (e) => {
    if (reducedRef.current) return
    const el = cardRef.current
    if (!el) return
    const rect = el.getBoundingClientRect()
    const px = (e.clientX - rect.left) / rect.width
    const py = (e.clientY - rect.top) / rect.height
    if (rafRef.current) cancelAnimationFrame(rafRef.current)
    rafRef.current = requestAnimationFrame(() => {
      const ry = (px - 0.5) * 14
      const rx = (0.5 - py) * 10
      el.style.setProperty('--tilt-x', `${rx.toFixed(2)}deg`)
      el.style.setProperty('--tilt-y', `${ry.toFixed(2)}deg`)
      el.style.setProperty('--glow-x', `${(px * 100).toFixed(1)}%`)
      el.style.setProperty('--glow-y', `${(py * 100).toFixed(1)}%`)
    })
  }

  const handleLeave = () => {
    if (rafRef.current) cancelAnimationFrame(rafRef.current)
    const el = cardRef.current
    if (!el) return
    el.style.setProperty('--tilt-x', '0deg')
    el.style.setProperty('--tilt-y', '0deg')
  }

  const cls = ['glass-card', phase === 'out' ? 'sf-out' : '', phase === 'in-start' ? 'sf-in-start' : ''].join(' ').trim()
  return (
    <div
      className={cls}
      ref={cardRef}
      onMouseMove={handleMove}
      onMouseLeave={handleLeave}
    >
      <span className="glass-ghost-num" aria-hidden="true">{String(index + 1).padStart(2, '0')}</span>
      <div className="glass-highlight" aria-hidden="true" />
      <div className="glass-icon-orb">{Icon[card.icon]}</div>
      <h4>{card.title}</h4>
      <ul className="glass-timeline">
        {card.points.map((p) => (
          <li key={p}>{p}</li>
        ))}
      </ul>
      <div className="glass-fill" aria-hidden="true">{Icon[card.icon]}</div>
    </div>
  )
}

function useSyncedStep(length, autoPlayMs = 3000) {
  const [index, setIndex] = useState(0)
  const [phase, setPhase] = useState('idle') // idle | out | in-start
  const reducedRef = useRef(false)
  const pausedRef = useRef(false)
  const timeouts = useRef([])

  useEffect(() => {
    reducedRef.current = window.matchMedia('(prefers-reduced-motion: reduce)').matches
  }, [])

  const goTo = (next) => {
    const target = ((next % length) + length) % length
    if (target === index) return
    if (reducedRef.current) {
      setIndex(target)
      return
    }
    setPhase('out')
    const t1 = setTimeout(() => {
      setIndex(target)
      setPhase('in-start')
      requestAnimationFrame(() => {
        requestAnimationFrame(() => setPhase('idle'))
      })
    }, 260)
    timeouts.current.push(t1)
  }

  useEffect(() => () => timeouts.current.forEach(clearTimeout), [])

  useEffect(() => {
    const t = setInterval(() => {
      if (!pausedRef.current) goTo(index + 1)
    }, autoPlayMs)
    return () => clearInterval(t)
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [index])

  return { index, phase, goTo, pausedRef }
}

const Stats = (function() {

const STATS = [
  { value: 35, suffix: '+', label: 'Years of Research' },
  { value: 500000, suffix: '+', label: 'Patients Treated Worldwide', format: true },
  { value: 40, suffix: '+', label: 'Countries Impacted' },
]

function useCountUp(target, start) {
  const [value, setValue] = useState(0)
  useEffect(() => {
    if (!start) return
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches
    if (reduced) {
      setValue(target)
      return
    }
    const duration = 1200
    const t0 = performance.now()
    let raf
    const tick = (now) => {
      const p = Math.min((now - t0) / duration, 1)
      setValue(Math.round(target * (1 - Math.pow(1 - p, 3))))
      if (p < 1) raf = requestAnimationFrame(tick)
    }
    raf = requestAnimationFrame(tick)
    return () => cancelAnimationFrame(raf)
  }, [target, start])
  return value
}

function Stat({ value, suffix, label, format, start }) {
  const n = useCountUp(value, start)
  const display = format ? n.toLocaleString('en-IN') : n
  return (
    <div>
      <div className="stat-value">{display}{suffix}</div>
      <div className="stat-label">{label}</div>
    </div>
  )
}

function Stats() {
  const ref = useRef(null)
  const [start, setStart] = useState(false)
  useEffect(() => {
    const el = ref.current
    if (!el) return
    if (!('IntersectionObserver' in window)) {
      setStart(true)
      return
    }
    const io = new IntersectionObserver(
      (entries) => {
        if (entries.some((e) => e.isIntersecting)) {
          setStart(true)
          io.disconnect()
        }
      },
      { threshold: 0.3 },
    )
    io.observe(el)
    return () => io.disconnect()
  }, [])
  return (
    <section className="stats" ref={ref}>
      <div className="container stats-grid">
        {STATS.map((s) => (
          <Stat key={s.label} {...s} start={start} />
        ))}
      </div>
    </section>
  )
}

return Stats;
})();
