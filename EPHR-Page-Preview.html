<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Entire Person Health Report (EPHR) — Recoup Health (Preview)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;600;700&display=swap" rel="stylesheet">
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
:root {
  --green-900: #38126d;   /* deep purple (hero/footer dark) */
  --green-800: #5b21b6;   /* dark purple */
  --green-600: #862cd6;   /* primary brand purple */
  --green-100: #f3e8ff;   /* light purple tint */
  --gold: #d8b4fe;        /* light lavender accent (on dark) */
  --ink: #1f2937;
  --muted: #6b7280;
  --bg: #f9fafb;
  --card: #ffffff;
  --radius: 14px;
  --shadow: 0 6px 24px rgba(134, 44, 214, 0.10);
  --font-display: 'Ubuntu', system-ui, sans-serif;
  --font-body: 'Ubuntu', system-ui, sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  font-family: var(--font-body);
  color: var(--ink);
  background: var(--bg);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

img { max-width: 100%; display: block; }

.container { width: min(1160px, 92%); margin: 0 auto; }

section { padding: 72px 0; }

h1, h2, h3 { font-family: var(--font-display); line-height: 1.15; font-weight: 600; }

.kicker {
  display: inline-block;
  font-size: 0.78rem;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--green-600);
  margin-bottom: 14px;
}

.section-title { font-size: clamp(1.7rem, 3.5vw, 2.4rem); margin-bottom: 12px; }
.section-sub { color: var(--muted); max-width: 640px; }

.btn {
  display: inline-block;
  padding: 14px 28px;
  border-radius: 999px;
  font-weight: 600;
  font-size: 0.95rem;
  text-decoration: none;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
  cursor: pointer;
  border: none;
}
.btn:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.btn-primary { background: var(--green-600); color: #fff; }
.btn-secondary { background: transparent; color: var(--green-800); border: 2px solid var(--green-800); }
.btn-gold { background: #ffffff; color: var(--green-800); }

/* Nav */
.nav {
  position: sticky; top: 0; z-index: 50;
  background: rgba(255, 255, 255, 0.92);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid rgba(134, 44, 214, 0.10);
}
.nav-inner { display: flex; align-items: center; justify-content: space-between; height: 72px; }
.nav-logo { font-family: var(--font-display); font-size: 1.35rem; color: var(--green-900); text-decoration: none; font-weight: 600; }
.nav-logo span { color: var(--gold); }
.nav-links { display: flex; gap: 26px; list-style: none; }
.nav-links a { text-decoration: none; color: var(--ink); font-size: 0.92rem; font-weight: 500; }
.nav-links a:hover { color: var(--green-600); }
.nav-toggle { display: none; background: none; border: none; font-size: 1.6rem; color: var(--green-900); cursor: pointer; }

/* Hero */
.hero {
  position: relative;
  overflow: hidden;
  background: linear-gradient(180deg, #faf7ff 0%, #f5eefc 55%, #f1e8fa 100%);
  padding: 90px 0 100px;
}
.hero-grid { display: grid; grid-template-columns: 1.05fr 0.95fr; gap: 40px; align-items: center; }

.hero-content { max-width: 640px; order: 1; }
.hero-figure { order: 2; }
.hero-badge {
  display: inline-block;
  background: #ffffff;
  border: 1px solid rgba(134,44,214,0.25);
  color: var(--green-800);
  font-size: 0.82rem;
  font-weight: 500;
  padding: 7px 16px;
  border-radius: 999px;
  margin-bottom: 22px;
  box-shadow: 0 2px 10px rgba(134,44,214,0.08);
}
.hero h1 {
  font-size: clamp(2.1rem, 4.4vw, 3.2rem);
  color: #111827;
  font-weight: 700;
  margin-bottom: 22px;
}
.hero h1 em {
  font-style: normal;
  background: linear-gradient(90deg, #862cd6, #a665e4);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.hero-sub { font-size: 1.02rem; color: #374151; margin-bottom: 16px; }
.hero-sub strong, .hero-support strong { color: #111827; font-weight: 700; }
.hero-support { font-size: 0.93rem; color: #4b5563; margin-bottom: 32px; }
.hero-ctas { display: flex; gap: 16px; flex-wrap: wrap; }
.btn-outline {
  background: #ffffff;
  color: #1f2937;
  border: 1px solid #d1d5db;
}

/* Doctor figure — large, unframed, badges floating around */
.hero-figure {
  position: relative;
  width: 100%;
  max-width: 560px;
  justify-self: end;
}
.hero-figure > img {
  width: 100%;
  height: auto;
  display: block;
  transform: scaleX(-1);
  filter: drop-shadow(0 18px 40px rgba(134,44,214,0.18));
  -webkit-mask-image: linear-gradient(180deg, #000 86%, transparent 99%);
  mask-image: linear-gradient(180deg, #000 86%, transparent 99%);
}
.float-badge {
  position: absolute;
  background: rgba(255,255,255,0.95);
  border: 1px solid rgba(134,44,214,0.22);
  border-radius: 12px;
  padding: 8px 12px;
  box-shadow: 0 6px 18px rgba(134,44,214,0.16);
  text-align: center;
  max-width: 170px;
}
.float-badge {
  animation: badge-in 0.6s ease backwards, badge-float 4s ease-in-out infinite;
}
.float-badge:nth-child(2) { animation-delay: 0.10s, 0.0s; }
.float-badge:nth-child(3) { animation-delay: 0.25s, 0.6s; }
.float-badge:nth-child(4) { animation-delay: 0.40s, 1.2s; }
.float-badge:nth-child(5) { animation-delay: 0.55s, 1.8s; }
.float-badge:nth-child(6) { animation-delay: 0.70s, 2.4s; }
.float-badge:nth-child(7) { animation-delay: 0.85s, 3.0s; }
@keyframes badge-in {
  from { opacity: 0; transform: translateY(14px) scale(0.92); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes badge-float {
  0%, 100% { translate: 0 0; }
  50%      { translate: 0 -7px; }
}
@media (prefers-reduced-motion: reduce) {
  .float-badge { animation: none; }
}
.float-badge strong { display: block; font-size: 0.78rem; color: var(--green-800); line-height: 1.25; }
.float-badge span { font-size: 0.68rem; color: var(--muted); }
.b-tl { top: 4%; left: -6%; }
.b-tr { top: 10%; right: -4%; }
.b-ml { top: 40%; left: -10%; }
.b-mr { top: 48%; right: -8%; }
.b-bl { bottom: 8%; left: -4%; }
.b-br { bottom: 3%; right: -2%; }

@media (max-width: 900px) {
  .hero-figure { max-width: 440px; margin: 24px auto 0; justify-self: center; }
  .b-tl { left: 0; } .b-ml { left: 0; } .b-bl { left: 0; }
  .b-tr { right: 0; } .b-mr { right: 0; } .b-br { right: 0; }
}

@media (max-width: 560px) {
  .hero-figure { max-width: 100%; }
  .float-badge { position: static; display: inline-block; margin: 4px; max-width: none; }
  .hero-figure { text-align: center; }
}

/* Trust bar */
.trustbar { padding: 28px 0; background: var(--card); border-bottom: 1px solid rgba(134,44,214,0.08); }
.trustbar-inner { display: flex; align-items: center; justify-content: center; gap: 40px; flex-wrap: wrap; color: var(--muted); font-size: 0.9rem; }
.trustbar-inner strong { color: var(--green-800); }

/* Cards */
.card-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin-top: 40px; }
.card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 28px;
  box-shadow: var(--shadow);
  border: 1px solid rgba(134,44,214,0.07);
}
.card .icon { font-size: 1.6rem; margin-bottom: 14px; }
.card h3 { font-size: 1.15rem; margin-bottom: 8px; }
.card p { color: var(--muted); font-size: 0.92rem; }
.card a { color: var(--green-600); font-weight: 600; font-size: 0.88rem; text-decoration: none; display: inline-block; margin-top: 12px; }

/* Stats */
.stats { background: var(--green-900); color: #fff; }
.stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; text-align: center; }
.stat-value { font-family: var(--font-display); font-size: clamp(2.2rem, 5vw, 3.2rem); color: var(--gold); }
.stat-label { color: rgba(255,255,255,0.75); font-size: 0.95rem; margin-top: 6px; }

/* FourR */
.fourr-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-top: 40px; }
.fourr-step {
  position: relative;
  background: var(--card);
  border-radius: var(--radius);
  padding: 26px;
  box-shadow: var(--shadow);
  overflow: hidden;
  transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.35s ease;
}
.fourr-step::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 4px;
  background: linear-gradient(90deg, #862cd6, #a665e4, #d8b4fe);
  transform: scaleX(0);
  transform-origin: left;
  transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
}
.fourr-step::after {
  content: '';
  position: absolute;
  top: 0; bottom: 0;
  width: 60%;
  left: -80%;
  background: linear-gradient(105deg, transparent, rgba(166,101,228,0.12), transparent);
  transform: skewX(-18deg);
  animation: card-sheen 5.5s ease-in-out infinite;
}
.fourr-step:nth-child(1)::after { animation-delay: 0s; }
.fourr-step:nth-child(2)::after { animation-delay: 0.7s; }
.fourr-step:nth-child(3)::after { animation-delay: 1.4s; }
.fourr-step:nth-child(4)::after { animation-delay: 2.1s; }
@keyframes card-sheen {
  0%, 55%, 100% { left: -80%; }
  25% { left: 120%; }
}
.fourr-step .num { position: relative; display: inline-block; }
.fourr-step .num::before {
  content: '';
  position: absolute;
  inset: -10px -14px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(134,44,214,0.16), transparent 70%);
  animation: num-breathe 3s ease-in-out infinite;
  z-index: -1;
}
@keyframes num-breathe {
  0%, 100% { transform: scale(0.85); opacity: 0.6; }
  50% { transform: scale(1.25); opacity: 1; }
}
.fourr-step:hover { transform: translateY(-8px); box-shadow: 0 18px 40px rgba(134,44,214,0.22); }
.fourr-step:hover::before { transform: scaleX(1); }
/* staggered entrance when section scrolls into view */
.reveal.visible .fourr-step { animation: card-rise 0.65s cubic-bezier(0.22, 1, 0.36, 1) backwards; }
.reveal.visible .fourr-step:nth-child(1) { animation-delay: 0.05s; }
.reveal.visible .fourr-step:nth-child(2) { animation-delay: 0.18s; }
.reveal.visible .fourr-step:nth-child(3) { animation-delay: 0.31s; }
.reveal.visible .fourr-step:nth-child(4) { animation-delay: 0.44s; }
@keyframes card-rise {
  from { opacity: 0; transform: translateY(28px) scale(0.96); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
@media (prefers-reduced-motion: reduce) {
  .reveal.visible .fourr-step { animation: none; }
  .fourr-step:hover { transform: none; }
  .fourr-step::after, .fourr-step .num::before { animation: none; }
}
.fourr-step .num {
  font-family: var(--font-display);
  font-size: 1.5rem;
  font-weight: 700;
  background: linear-gradient(90deg, #862cd6, #a665e4);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.fourr-step h3 { margin: 8px 0 6px; font-size: 1.2rem; }
.fourr-step p { color: var(--muted); font-size: 0.9rem; }

/* Founder */
.founder { background: var(--green-100); padding: 96px 0; }
.founder-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 56px; align-items: center; }

.founder-lead {
  font-size: 1.02rem;
  line-height: 1.65;
  color: #3a3346;
  margin: 18px 0 30px;
}

.founder-stat-strip {
  display: flex;
  gap: 28px;
  flex-wrap: wrap;
  padding-top: 24px;
  border-top: 1px solid rgba(134,44,214,0.18);
}
.stat-strip-item strong {
  display: block;
  font-family: var(--font-display);
  font-size: 1.15rem;
  color: var(--green-800);
  margin-bottom: 4px;
}
.stat-strip-item span { font-size: 0.8rem; color: var(--muted); line-height: 1.4; max-width: 160px; display: block; }

.founder-gallery { position: relative; }

.founder-float-badge {
  position: absolute;
  top: -18px; right: 18px;
  z-index: 3;
  background: #fff;
  border-radius: 14px;
  padding: 10px 16px;
  font-weight: 700;
  font-size: 0.88rem;
  color: var(--green-800);
  box-shadow: 0 12px 28px rgba(134,44,214,0.24);
  display: flex;
  align-items: center;
  gap: 8px;
  transform: rotate(2deg);
}
.founder-float-badge small {
  display: block;
  font-weight: 500;
  color: var(--muted);
  font-size: 0.7rem;
  margin-left: 4px;
}

.founder-photo-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}

.achv-card {
  position: relative;
  border-radius: 20px;
  overflow: hidden;
  aspect-ratio: 1 / 1;
  box-shadow: var(--shadow);
  transition: transform 0.3s cubic-bezier(0.22,1,0.36,1), box-shadow 0.3s ease;
}
.achv-card:hover { transform: translateY(-5px); box-shadow: 0 18px 40px rgba(134,44,214,0.22); }
.achv-bg {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: center;
  filter: saturate(1.05);
}
.achv-bg-tint {
  filter: grayscale(0.35) sepia(0.25) hue-rotate(220deg) saturate(1.8);
}
.achv-scrim {
  position: absolute;
  inset: 0;
  background: linear-gradient(0deg, rgba(20,8,38,0.88) 0%, rgba(20,8,38,0.25) 55%, rgba(20,8,38,0.15) 100%);
}
.achv-content {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  padding: 16px;
  color: #fff;
}
.achv-emoji { font-size: 1.2rem; display: block; margin-bottom: 4px; }
.achv-content strong { display: block; font-size: 0.92rem; margin-bottom: 4px; }
.achv-content p { font-size: 0.74rem; line-height: 1.35; color: rgba(255,255,255,0.85); }

/* Testimonials */
.testimonial-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin-top: 40px; }
.testimonial { background: var(--card); border-radius: var(--radius); padding: 26px; box-shadow: var(--shadow); font-size: 0.92rem; }
.testimonial p { color: var(--ink); font-style: italic; }
.testimonial footer { margin-top: 16px; color: var(--muted); font-size: 0.85rem; }
.testimonial footer strong { color: var(--green-800); display: block; font-style: normal; }

/* Final CTA */
.final-cta { background: linear-gradient(160deg, var(--green-800), var(--green-900)); color: #fff; text-align: center; border-radius: var(--radius); padding: 64px 32px; }
.final-cta h2 { color: #fff; font-size: clamp(1.6rem, 3vw, 2.2rem); margin-bottom: 12px; }
.final-cta p { color: rgba(255,255,255,0.8); max-width: 560px; margin: 0 auto 28px; }

/* Footer */
.footer { background: var(--green-900); color: rgba(255,255,255,0.8); padding: 56px 0 28px; margin-top: 72px; }
.footer-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 40px; }
.footer h4 { color: #fff; font-size: 0.95rem; margin-bottom: 14px; }
.footer ul { list-style: none; }
.footer li { margin-bottom: 8px; }
.footer a { color: rgba(255,255,255,0.75); text-decoration: none; font-size: 0.9rem; }
.footer a:hover { color: var(--gold); }
.footer-bottom { border-top: 1px solid rgba(255,255,255,0.12); margin-top: 40px; padding-top: 22px; font-size: 0.82rem; text-align: center; color: rgba(255,255,255,0.5); }

/* WhatsApp float */
.wa-float {
  position: fixed; right: 22px; bottom: 22px; z-index: 60;
  background: #25d366; color: #fff; width: 56px; height: 56px;
  border-radius: 50%; display: flex; align-items: center; justify-content: center;
  font-size: 1.7rem; text-decoration: none; box-shadow: 0 8px 20px rgba(0,0,0,0.25);
}

/* Reveal animation — CSS only, respects reduced motion */
.reveal { opacity: 0; transform: translateY(16px); transition: opacity 0.5s ease, transform 0.5s ease; }
.reveal.visible { opacity: 1; transform: none; }

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .reveal { opacity: 1; transform: none; transition: none; }
  .btn:hover { transform: none; }
}

@media (max-width: 900px) {
  .hero-grid, .founder-grid { grid-template-columns: 1fr; }
  .founder-float-badge { position: static; transform: none; display: inline-flex; margin-bottom: 16px; }
  .founder-stat-strip { gap: 20px; }
  .card-grid, .testimonial-grid { grid-template-columns: 1fr 1fr; }
  .fourr-grid { grid-template-columns: 1fr 1fr; }
  .footer-grid { grid-template-columns: 1fr 1fr; }
  .nav-links {
    display: none;
    position: absolute; top: 72px; left: 0; right: 0;
    background: var(--bg); flex-direction: column; padding: 20px 6%;
    border-bottom: 1px solid rgba(134,44,214,0.12);
  }
  .nav-links.open { display: flex; }
  .nav-toggle { display: block; }
  .nav-cta { display: none; }
}

@media (max-width: 560px) {
  .card-grid, .testimonial-grid, .fourr-grid, .stats-grid, .footer-grid { grid-template-columns: 1fr; }
  section { padding: 52px 0; }
}

/* ============ Why Choose Us — Apple-inspired Liquid Glass ============ */
.wc-section {
  position: relative;
  padding: 88px 0;
  overflow: hidden;
  background: linear-gradient(180deg, #f7f2fd 0%, #f1e9fb 100%);
}

.wc-columns {
  position: relative;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 56px;
  margin-bottom: 8px;
}
.wc-col .section-title { margin-bottom: 0; }

.wc-stage {
  position: relative;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 32px;
  margin-top: 28px;
  align-items: stretch;
}
.wc-stage-col {
  position: relative;
  display: flex;
  align-items: stretch;
  border-radius: 32px;
  overflow: hidden;
  padding: 26px 18px;
  background-size: cover;
  background-position: center;
  isolation: isolate;
  perspective: 1600px;
}
.wc-stage-scrim {
  position: absolute;
  inset: 0;
  background: linear-gradient(165deg, rgba(56,18,109,0.62), rgba(134,44,214,0.38));
  z-index: 0;
}
.wc-stage-col > .glass-card { position: relative; z-index: 1; }

/* --- Liquid glass card --- */
.glass-card {
  position: relative;
  flex: 1;
  display: flex;
  flex-direction: column;
  border-radius: 28px;
  padding: 34px 30px 30px;
  overflow: hidden;
  isolation: isolate;
  background: linear-gradient(150deg, rgba(255,255,255,0.62), rgba(255,255,255,0.28));
  backdrop-filter: blur(22px) saturate(180%);
  -webkit-backdrop-filter: blur(22px) saturate(180%);
  border: 1px solid rgba(255,255,255,0.55);
  box-shadow:
    0 20px 50px rgba(88,28,135,0.16),
    0 2px 8px rgba(88,28,135,0.08),
    inset 0 1px 1px rgba(255,255,255,0.75),
    inset 0 -1px 12px rgba(134,44,214,0.06);
  transform-style: preserve-3d;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  transform: rotateX(var(--tilt-x, 0deg)) rotateY(var(--tilt-y, 0deg));
  transition: transform 0.32s cubic-bezier(0.22,1,0.36,1), opacity 0.32s ease, box-shadow 0.3s ease;
}
.glass-card:hover {
  box-shadow:
    0 26px 60px rgba(88,28,135,0.22),
    0 4px 10px rgba(88,28,135,0.10),
    inset 0 1px 1px rgba(255,255,255,0.85),
    inset 0 -1px 14px rgba(134,44,214,0.09);
  transform: rotateX(var(--tilt-x, 0deg)) rotateY(var(--tilt-y, 0deg)) translateY(-4px);
}
.glass-card.sf-out {
  transition: transform 0.34s cubic-bezier(0.4,0,0.2,1), opacity 0.28s ease;
  transform: rotateY(-98deg) scale(0.92);
  opacity: 0;
}
.glass-card.sf-in-start {
  transition: none;
  transform: rotateY(98deg) scale(0.92);
  opacity: 0;
}

/* specular highlight that follows the cursor, like light catching glass */
.glass-highlight {
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at var(--glow-x, 28%) var(--glow-y, 15%), rgba(255,255,255,0.6), rgba(255,255,255,0) 42%);
  pointer-events: none;
  z-index: 0;
  transition: background 0.15s ease;
}

.glass-ghost-num {
  position: absolute;
  top: -6px; right: 14px;
  font-family: var(--font-display);
  font-size: 6.5rem;
  font-weight: 700;
  color: rgba(134,44,214,0.10);
  line-height: 1;
  z-index: 0;
  user-select: none;
}

/* Discover — living orbit */

/* soft pulsing glow behind everything */
.ephr-orbit-glow {
  position: absolute;
  left: 50%; top: 50%;

  width: 560px; height: 560px;
  border-radius: 50%;

  animation: ephr-pulse 3.5s ease-in-out infinite;
}
@keyframes ephr-pulse {
  0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.9; }
  50% { transform: translate(-50%, -50%) scale(1.25); opacity: 0.5; }
}

.ephr-orbit-ring {
  position: absolute;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  width: 772px; height: 772px;
  border-radius: 50%;
  border: 2px dashed rgba(134, 44, 214, 0.3);
  animation: ephr-spin 90s linear infinite;
}
@keyframes ephr-spin-rev-center {
  from { transform: translate(-50%, -50%) rotate(360deg); }
  to { transform: translate(-50%, -50%) rotate(0deg); }
}

/* center hub — full figure, no circle, standing on a glowing pedestal, turning */
.ephr-orbit-hub {
  position: absolute;
  left: 50%; top: 50%;
  width: 360px; height: 560px;
  transform: translate(-50%, -50%);
  z-index: 2;
}

/* Halo — glowing rotating light aura behind the figure */
.ephr-halo {
  position: absolute;
  left: 50%; top: 44%;
  width: 480px; height: 480px;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  background: conic-gradient(
    from 0deg,
    rgba(134, 44, 214, 0.9),
    rgba(216, 180, 254, 0.7),
    rgba(255, 215, 130, 0.85),
    rgba(79, 142, 247, 0.75),
    rgba(134, 44, 214, 0.9)
  );
  filter: blur(30px);
  opacity: 0.6;
  animation: ephr-halo-spin 10s linear infinite, ephr-halo-pulse 4s ease-in-out infinite;
  z-index: 0;
}
@keyframes ephr-halo-spin {
  from { transform: translate(-50%, -50%) rotate(0deg); }
  to { transform: translate(-50%, -50%) rotate(360deg); }
}
@keyframes ephr-halo-pulse {
  0%, 100% { opacity: 0.5; transform: translate(-50%, -50%) rotate(0deg) scale(1); }
  50% { opacity: 0.8; transform: translate(-50%, -50%) rotate(180deg) scale(1.08); }
}
@media (prefers-reduced-motion: reduce) {
  .ephr-halo { animation: ephr-halo-pulse 4s ease-in-out infinite; }
}

.ephr-orbit-hub-spin {
  position: absolute;
  inset: 0;
  z-index: 1;
  transform-style: preserve-3d;
  animation: ephr-hub-spin 13s linear infinite;
}
@keyframes ephr-hub-spin {
  from { transform: rotateY(0deg); }
  to { transform: rotateY(360deg); }
}

.ephr-orbit-hub-img {
  position: absolute;
  left: 50%; bottom: 8%;
  transform: translateX(-50%);
  height: 84%;
  width: auto;
  max-width: none;
  object-fit: contain;
  /* fade the edges so the figure blends into the section background instead of a hard cutout */
  -webkit-mask-image: radial-gradient(ellipse 62% 78% at 50% 42%, #000 58%, transparent 100%);
  mask-image: radial-gradient(ellipse 62% 78% at 50% 42%, #000 58%, transparent 100%);
  filter: drop-shadow(0 22px 34px rgba(56, 18, 109, 0.28));
  transition: filter 0.3s ease;
}
.ephr-orbit-hub.active .ephr-orbit-hub-img {

}

/* Pedestal — glowing platform the figure stands and turns on */
.ephr-pedestal {

}

}
.ephr-illus-icon {

}
.ephr-illus-icon svg { width: 55%; height: 55%; }

}
.ephr-illus-icon-sm {

.ephr-illus-pos-br { right: 10px; bottom: 10px; }

@media (max-width: 640px) {
  .ephr-journey-layout { grid-template-columns: 40px 1fr; gap: 6px 16px; }
  .ephr-timeline-dot { width: 32px; height: 32px; font-size: 0.82rem; }
  .ephr-journey-card-body { grid-template-columns: 1fr; }

/* Why Recoup */
.ephr-pillars { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 32px; }
.ephr-pill {
  display: inline-flex; align-items: center; gap: 8px;

}

.ephr-why-note {

  font-style: italic;
}
.ephr-why { position: relative; overflow: hidden; }
.ephr-why .container { position: relative; z-index: 1; }

/* Real biomarker photo, tinted purple-blue and kept just as subtle as the DNA strands */
.ephr-biomarker-photo {

  right: -3%;

@media (prefers-reduced-motion: reduce) {

}
@media (max-width: 900px) {

/* FAQ */

.ephr-faq { max-width: 720px; margin: 36px auto 0; }
.ephr-faq-item { border-bottom: 1px solid rgba(134, 44, 214, 0.12); }
.ephr-faq-item button {

  background: none; border: none;

}
.ephr-faq-chevron {

}
.ephr-faq-chevron.open { transform: rotate(180deg); }
.ephr-faq-chevron svg { width: 100%; height: 100%; }
.ephr-faq-item > p { padding: 0 32px 20px 0; color: var(--muted); }

/* Final CTA */
.ephr-final { position: relative; overflow: hidden; background: var(--green-900); color: #fff; }
.ephr-final .section-title { color: #fff; }
.ephr-final-grid {
  position: relative;
  z-index: 1;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 48px;
  align-items: center;
}
.ephr-final-sub { color: #e9d8ff; margin-top: 18px; font-size: 1.02rem; }
.ephr-final-card {
  background: #fff;
  color: var(--ink);
  border-radius: var(--radius);
  padding: 36px;
  box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);

}
.ephr-final-btn { width: 100%; text-align: center; margin-top: 24px; }

/* Responsive */
@media (max-width: 900px) {
  .ephr-hero-grid,
  .ephr-price-card,
  .ephr-final-grid { grid-template-columns: 1fr; }
  .ephr-hero { padding: 64px 0 56px; }
  .ephr-dash-top { grid-template-columns: 1fr; }
  .ephr-dash-bars { grid-template-columns: 1fr; }
  .ephr-included-list { grid-template-columns: 1fr; }
  .ephr-who-grid { grid-template-columns: 1fr; }
  .ephr-compare-head div,
  .ephr-compare-left,
  .ephr-compare-right { padding: 12px 14px; font-size: 0.85rem; }
}


/* ============ Hero Scene — HUD conductor ============ */

.ephr-heroscene {
  position: relative;
  width: 100%;
  aspect-ratio: 4 / 3;
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: 0 18px 48px rgba(56, 18, 109, 0.35);
  --ephr-parallax: 0;
}

.ephr-heroscene-bg {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse at 30% 20%, rgba(134, 44, 214, 0.55), transparent 55%),
    radial-gradient(ellipse at 75% 70%, rgba(94, 234, 212, 0.18), transparent 50%),
    linear-gradient(160deg, #1c0b34 0%, #2b0f4f 45%, #150826 100%);
}

.ephr-heroscene-floor {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 46%;
  background-image:
    linear-gradient(rgba(216, 180, 254, 0.14) 1px, transparent 1px),
    linear-gradient(90deg, rgba(216, 180, 254, 0.14) 1px, transparent 1px);
  background-size: 34px 34px;
  -webkit-mask-image: linear-gradient(to top, rgba(0, 0, 0, 0.9), transparent);
  mask-image: linear-gradient(to top, rgba(0, 0, 0, 0.9), transparent);
  transform: perspective(300px) rotateX(55deg);
  transform-origin: bottom;
  translate: calc(var(--ephr-parallax) * -12px) 0;
}

.ephr-heroscene-vignette {
  position: absolute;
  inset: 0;
  box-shadow: inset 0 0 90px rgba(10, 4, 20, 0.65);
  pointer-events: none;
}

.ephr-heroscene-burst {
  position: absolute;
  left: 47%; top: 44%;
  width: 60px; height: 60px;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  background: radial-gradient(circle, rgba(216, 180, 254, 0.9), rgba(94, 234, 212, 0) 70%);
  animation: ephr-hero-burst 1.6s ease-out forwards;
}
@keyframes ephr-hero-burst {
  0% { opacity: 0; scale: 0.2; }
  35% { opacity: 1; scale: 3.4; }
  100% { opacity: 0; scale: 6.5; }
}

.ephr-heroscene-lines {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}
.ephr-hero-link {
  fill: none;
  stroke: url(#heroLineGrad);
  stroke-width: 1.6;
  stroke-dasharray: 6 8;
  opacity: 0;
  animation:
    ephr-link-in 0.6s ease forwards,
    ephr-link-flow 3.5s linear infinite;
}
.l1 { animation-delay: 0.6s, 1.2s; }
.l2 { animation-delay: 0.75s, 1.35s; }
.l3 { animation-delay: 0.9s, 1.5s; }
.l4 { animation-delay: 1.05s, 1.65s; }
@keyframes ephr-link-in {
  from { opacity: 0; }
  to { opacity: 0.7; }
}
@keyframes ephr-link-flow {
  from { stroke-dashoffset: 60; }
  to { stroke-dashoffset: 0; }
}

/* Doctor silhouette */
.ephr-hero-doctor {
  position: absolute;
  left: 34%;
  bottom: 6%;
  width: 130px;
  height: 260px;
  opacity: 0;
  animation: ephr-hero-fade-up 0.7s ease 0.15s forwards;
  translate: calc(var(--ephr-parallax) * 10px) 0;
}
@keyframes ephr-hero-fade-up {
  from { opacity: 0; transform: translateY(18px); }
  to { opacity: 1; transform: translateY(0); }
}
.ephr-hero-doctor-glow {
  position: absolute;
  left: 50%; bottom: 4%;
  width: 120px; height: 26px;
  transform: translateX(-50%);
  border-radius: 50%;
  background: radial-gradient(ellipse at center, rgba(94, 234, 212, 0.45), transparent 72%);
  filter: blur(3px);
  animation: ephr-pedestal-pulse 3.4s ease-in-out infinite;
}
.ephr-hero-doctor-head {
  position: absolute;
  left: 50%; top: 0;
  width: 34px; height: 34px;
  transform: translateX(-50%);
  border-radius: 50%;
  background: linear-gradient(160deg, rgba(255, 255, 255, 0.85), rgba(216, 180, 254, 0.35));
  box-shadow: 0 0 18px rgba(216, 180, 254, 0.5);
}
.ephr-hero-doctor-body {
  position: absolute;
  left: 50%; top: 32px;
  width: 84px; height: 150px;
  transform: translateX(-50%);
  border-radius: 40px 40px 20px 20px;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.9), rgba(167, 139, 250, 0.25));
  box-shadow: 0 0 26px rgba(167, 139, 250, 0.35);
}
.ephr-hero-doctor-arm {
  position: absolute;
  left: 62%; top: 46px;
  width: 68px; height: 16px;
  border-radius: 10px;
  background: linear-gradient(90deg, rgba(255, 255, 255, 0.85), rgba(216, 180, 254, 0.5));
  transform-origin: left center;
  rotate: -38deg;
  box-shadow: 0 0 14px rgba(216, 180, 254, 0.4);
}
.ephr-hero-doctor-hand {
  position: absolute;
  left: 84%; top: 12px;
  width: 14px; height: 14px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 0 14px 4px rgba(94, 234, 212, 0.8);
  animation: ephr-hand-pulse 2s ease-in-out infinite;
}
@keyframes ephr-hand-pulse {
  0%, 100% { box-shadow: 0 0 10px 3px rgba(94, 234, 212, 0.6); }
  50% { box-shadow: 0 0 20px 6px rgba(94, 234, 212, 1); }
}

/* HUD panels */
.ephr-hud-panel {
  position: absolute;
  width: 118px;
  height: 92px;
  padding: 10px;
  border-radius: 10px;
  background: linear-gradient(160deg, rgba(43, 15, 79, 0.55), rgba(20, 8, 38, 0.55));
  border: 1px solid rgba(216, 180, 254, 0.4);
  box-shadow: 0 0 24px rgba(134, 44, 214, 0.35), inset 0 0 20px rgba(94, 234, 212, 0.06);
  backdrop-filter: blur(2px);
  opacity: 0;
  animation:
    ephr-hud-in 0.6s ease forwards,
    ephr-hud-float 5s ease-in-out infinite;
  animation-delay: var(--ephr-delay), calc(var(--ephr-delay) + 0.6s);
}
@keyframes ephr-hud-in {
  from { opacity: 0; transform: scale(0.7) translateY(10px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}
@keyframes ephr-hud-float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}

.p-anatomy { left: 4%; top: 14%; translate: calc(var(--ephr-parallax) * -18px) 0; }
.p-dna { right: 3%; top: 6%; translate: calc(var(--ephr-parallax) * 22px) 0; }
.p-chart { right: 6%; bottom: 18%; translate: calc(var(--ephr-parallax) * 16px) 0; }
.p-molecule { left: 3%; bottom: 8%; translate: calc(var(--ephr-parallax) * -14px) 0; }

.ephr-hud-panel-glyph {
  width: 100%;
  height: 52px;
  display: flex; align-items: center; justify-content: center;
}
.ephr-hud-dna-svg, .ephr-hud-molecule-svg, .ephr-hud-anatomy-svg { height: 100%; width: auto; }
.ephr-hud-chart-svg { width: 100%; height: auto; }
.ephr-hud-panel-label {
  margin-top: 4px;
  font-size: 0.6rem;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: #e9d8ff;
  text-align: center;
  opacity: 0.85;
}
.ephr-hud-scanline {
  position: absolute;
  left: 0; right: 0;
  height: 1px;
  background: rgba(94, 234, 212, 0.7);
  box-shadow: 0 0 8px rgba(94, 234, 212, 0.8);
  animation: ephr-scan 2.6s linear infinite;
}
@keyframes ephr-scan {
  0% { top: 6%; opacity: 0; }
  10% { opacity: 0.9; }
  90% { opacity: 0.9; }
  100% { top: 94%; opacity: 0; }
}

.ephr-hud-corner {
  position: absolute;
  width: 10px; height: 10px;
  border: 1.5px solid #5eead4;
  opacity: 0.85;
}
.ephr-hud-corner.tl { left: 4px; top: 4px; border-right: none; border-bottom: none; }
.ephr-hud-corner.tr { right: 4px; top: 4px; border-left: none; border-bottom: none; }
.ephr-hud-corner.bl { left: 4px; bottom: 4px; border-right: none; border-top: none; }
.ephr-hud-corner.br { right: 4px; bottom: 4px; border-left: none; border-top: none; }

.ephr-anatomy-pulse {
  animation: ephr-anatomy-pulse 2.2s ease-in-out infinite;
}
.ephr-anatomy-pulse.d2 { animation-delay: 0.4s; }
.ephr-anatomy-pulse.d3 { animation-delay: 0.8s; }
@keyframes ephr-anatomy-pulse {
  0%, 100% { opacity: 0.4; r: 2.4; }
  50% { opacity: 1; r: 4; }
}

/* Drifting particles */
.ephr-hero-particle {
  position: absolute;
  width: 4px; height: 4px;
  border-radius: 50%;
  background: #d8b4fe;
  box-shadow: 0 0 6px 2px rgba(216, 180, 254, 0.7);
  opacity: 0.7;
  animation: ephr-particle-float linear infinite;
}
.p0 { left: 12%; top: 20%; animation-duration: 9s; background: #5eead4; box-shadow: 0 0 6px 2px rgba(94,234,212,0.7); }
.p1 { left: 55%; top: 10%; animation-duration: 11s; animation-delay: -2s; }
.p2 { left: 80%; top: 40%; animation-duration: 8s; animation-delay: -4s; background: #facc15; box-shadow: 0 0 6px 2px rgba(250,204,21,0.7); }
.p3 { left: 25%; top: 65%; animation-duration: 10s; animation-delay: -1s; }
.p4 { left: 68%; top: 60%; animation-duration: 12s; animation-delay: -6s; background: #5eead4; box-shadow: 0 0 6px 2px rgba(94,234,212,0.7); }
.p5 { left: 40%; top: 85%; animation-duration: 9.5s; animation-delay: -3s; }
.p6 { left: 8%; top: 50%; animation-duration: 10.5s; animation-delay: -5s; background: #facc15; box-shadow: 0 0 6px 2px rgba(250,204,21,0.7); }
.p7 { left: 90%; top: 75%; animation-duration: 8.5s; animation-delay: -2.5s; }
.p8 { left: 48%; top: 30%; animation-duration: 11.5s; animation-delay: -7s; }
.p9 { left: 75%; top: 15%; animation-duration: 9s; animation-delay: -4.5s; background: #5eead4; box-shadow: 0 0 6px 2px rgba(94,234,212,0.7); }

@keyframes ephr-particle-float {
  0% { transform: translate(0, 0); opacity: 0; }
  10% { opacity: 0.8; }
  90% { opacity: 0.8; }
  100% { transform: translate(12px, -60px); opacity: 0; }
}

@media (prefers-reduced-motion: reduce) {
  .ephr-heroscene * { animation: none !important; }
}

@media (max-width: 720px) {
  .ephr-hud-panel { width: 92px; height: 76px; }
  .ephr-hud-panel-label { font-size: 0.52rem; }
  .ephr-hero-doctor { width: 100px; height: 200px; }
}


/* ============ Sample EPHR Report — flipbook ============ */

.sr-book-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin: 0 auto;
}

.sr-book {
  position: relative;
  width: min(380px, 88vw);
  aspect-ratio: 595 / 780;
}

.sr-leaf {
  position: absolute;
  inset: 0;
  border-radius: 14px;
  background: #fff;
  box-shadow: 0 18px 40px rgba(56, 18, 109, 0.22);
  overflow: hidden;
}
.sr-leaf-base { z-index: 1; }

.sr-leaf-flip {
  z-index: 2;
  transform-style: preserve-3d;
}
.sr-flip-next { animation: sr-flip-next-anim 0.5s ease forwards; transform-origin: left center; }
.sr-flip-prev { animation: sr-flip-prev-anim 0.5s ease forwards; transform-origin: right center; }
@keyframes sr-flip-next-anim {
  from { transform: rotateY(0deg); }
  to { transform: rotateY(-178deg); }
}
@keyframes sr-flip-prev-anim {
  from { transform: rotateY(0deg); }
  to { transform: rotateY(178deg); }
}

.sr-leaf-face {
  position: absolute;
  inset: 0;
  backface-visibility: hidden;
  border-radius: 14px;
  overflow: hidden;
  background: #fff;
}
.sr-leaf-front { transform: rotateY(0deg); }
.sr-leaf-back {
  transform: rotateY(180deg);
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(160deg, var(--green-800), var(--green-900));
}
.sr-leaf-back-brand {
  color: #fff;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 1.1rem;
  letter-spacing: 0.04em;
  opacity: 0.85;
}

.sr-book-shadow {
  position: absolute;
  left: 6%;
  right: 6%;
  bottom: -14px;
  height: 22px;
  background: radial-gradient(ellipse at center, rgba(56, 18, 109, 0.28), transparent 72%);
  z-index: 0;
  filter: blur(2px);
}

/* Page content */
.sr-page {
  position: absolute;
  inset: 0;
  padding: 20px 20px 26px;
  display: flex;
  flex-direction: column;
  font-size: 0.78rem;
}
.sr-page-center { align-items: center; text-align: center; }
.sr-center { text-align: center; }

.sr-header {
  background: var(--green-800);
  color: #fff;
  border-radius: 12px;
  padding: 10px 14px;
  display: flex;
  flex-direction: column;
  gap: 2px;
  margin-bottom: 16px;
}
.sr-header-eyebrow {
  font-size: 0.58rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  opacity: 0.75;
}
.sr-header-meta { font-size: 0.72rem; font-weight: 600; }

.sr-page-title {
  font-family: var(--font-display);
  font-size: 1.05rem;
  color: var(--ink);
  margin-bottom: 12px;
}
.sr-page-note {
  font-size: 0.68rem;
  color: var(--muted);
  margin-top: 10px;
  line-height: 1.5;
}

/* Cover */
.sr-page-cover { padding: 0; }
.sr-cover-topbar {
  background: var(--bg);
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  border-radius: 0 0 20px 20px;
}
.sr-cover-title { font-family: var(--font-display); font-size: 1.05rem; color: var(--green-900); font-weight: 700; }
.sr-cover-brand { font-size: 0.7rem; font-weight: 700; color: var(--green-600); letter-spacing: 0.04em; }
.sr-cover-body { padding: 20px; display: flex; flex-direction: column; gap: 10px; }
.sr-cover-name { font-family: var(--font-display); font-size: 1.3rem; color: var(--ink); }
.sr-cover-meta { color: var(--muted); font-size: 0.85rem; margin-top: -6px; }
.sr-cover-blurb {
  margin-top: 16px;
  background: var(--bg);
  border-radius: 14px;
  padding: 14px 16px;
  font-size: 0.72rem;
  color: var(--muted);
  line-height: 1.55;
}
.sr-cover-blurb-title { font-family: var(--font-display); color: var(--ink); font-size: 0.85rem; margin-bottom: 6px; }

/* Score page */
.sr-score-row { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; }
.sr-score-callout {
  flex: 1;
  background: var(--green-800);
  color: #fff;
  border-radius: 10px;
  padding: 10px 12px;
  font-size: 0.72rem;
  line-height: 1.4;
}
.sr-score-bar { position: relative; margin: 8px 0 6px; }
.sr-score-bar-track {
  height: 8px;
  border-radius: 999px;
  background: linear-gradient(90deg, #ef4444, #facc15, #22c55e);
}
.sr-score-bar-marker {
  position: absolute;
  top: -18px;
  transform: translateX(-50%);
  background: var(--green-900);
  color: #fff;
  font-size: 0.62rem;
  font-weight: 700;
  border-radius: 999px;
  padding: 2px 6px;
}
.sr-score-labels {
  display: flex;
  justify-content: space-between;
  font-size: 0.55rem;
  color: var(--muted);
}

/* Tree page */
.sr-tree-hero { display: flex; justify-content: center; margin: 6px 0 14px; }

/* Body function page */
.sr-bf-grid { display: grid; grid-template-columns: 1fr 1.3fr; gap: 12px; }
.sr-bf-visual {
  position: relative;
  background: var(--bg);
  border-radius: 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 10px;
}
.sr-bf-risk { display: flex; flex-direction: column; align-items: center; }
.sr-bf-risk-label { font-size: 0.6rem; font-weight: 700; color: var(--green-600); }
.sr-bf-insights { display: flex; flex-direction: column; gap: 10px; }
.sr-bf-block {
  border-radius: 10px;
  padding: 8px 10px;
  background: var(--bg);
}
.sr-bf-block span {
  display: block;
  font-size: 0.56rem;
  font-weight: 700;
  letter-spacing: 0.06em;
  margin-bottom: 4px;
}
.sr-bf-good span { color: #16a34a; }
.sr-bf-warn span { color: #d97706; }
.sr-bf-block ul { padding-left: 14px; margin: 0; font-size: 0.66rem; color: var(--ink); line-height: 1.5; }

/* Biomarker table */
.sr-table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 0.66rem; }
.sr-table th {
  text-align: left;
  font-size: 0.56rem;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--muted);
  padding: 6px 4px;
  border-bottom: 1px solid rgba(134, 44, 214, 0.15);
}
.sr-table td { padding: 7px 4px; border-bottom: 1px solid rgba(134, 44, 214, 0.08); }
.sr-flag-high { color: #dc2626; font-weight: 700; }

/* Controls */
.sr-book-controls {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-top: 22px;
}
.sr-book-nav {
  width: 36px; height: 36px;
  border-radius: 50%;
  border: 1px solid rgba(134, 44, 214, 0.3);
  background: #fff;
  color: var(--green-700, var(--green-600));
  font-size: 1.3rem;
  line-height: 1;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.2s ease, color 0.2s ease;
}
.sr-book-nav:hover:not(:disabled) { background: var(--green-600); color: #fff; }
.sr-book-nav:disabled { opacity: 0.35; cursor: default; }
.sr-book-dots { display: flex; gap: 8px; }
.sr-book-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  border: none;
  background: rgba(134, 44, 214, 0.25);
  cursor: pointer;
  padding: 0;
}
.sr-book-dot.active { background: var(--green-600); width: 22px; border-radius: 999px; transition: width 0.25s ease; }
.sr-book-caption { margin-top: 14px; font-size: 0.78rem; color: var(--muted); text-align: center; }

@media (prefers-reduced-motion: reduce) {
  .sr-leaf-flip { animation-duration: 0.01ms; }
}

</style>

function Nav() {
  const [open, setOpen] = useState(false)
  return (
    <header className="nav">
      <div className="container nav-inner">
        <a className="nav-logo" href="/">
          <img src="https://www.recoup.health/logo.png" alt="Recoup Health" style={{ height: 44, width: 'auto' }} />
        </a>
        <nav>
          <ul className={`nav-links ${open ? 'open' : ''}`}>
            {links.map((l) => (
              <li key={l.href}><a href={l.href} onClick={() => setOpen(false)}>{l.label}</a></li>
            ))}
          </ul>
        </nav>
        <a className="btn btn-primary nav-cta" href="/contact">Book Consultation</a>

          aria-expanded={open}

}

/* ------------------------------------------------------------------ */
/*  HeroScene — stylized "doctor as HUD conductor" animation           */
/*  Inspired by Iron Man / JARVIS multi-screen holograms, adapted to   */
/*  a clinical setting: a doctor silhouette gestures at floating       */
/*  holographic panels (anatomy scan, DNA, biomarkers, molecules)      */
/*  connected by light lines, with DNA/molecule particles drifting     */
/*  and a scan-line HUD floor. Pure CSS/SVG — no video file needed.    */
/* ------------------------------------------------------------------ */

function HudCorners() {
  return (
    <>
      <span className="ephr-hud-corner tl" />
      <span className="ephr-hud-corner tr" />
      <span className="ephr-hud-corner bl" />
      <span className="ephr-hud-corner br" />
    </>
  )
}

function DnaGlyph() {
  return (
    <svg viewBox="0 0 60 90" className="ephr-hud-dna-svg">
      <defs>
        <linearGradient id="heroDnaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stopColor="#d8b4fe" />
          <stop offset="100%" stopColor="#5eead4" />
        </linearGradient>
      </defs>
      {Array.from({ length: 9 }).map((_, i) => {
        const y = i * 10 + 5
        const off = Math.sin(i * 0.9) * 16
        return (
          <g key={i}>
            <line
              x1={30 - off}
              y1={y}
              x2={30 + off}
              y2={y}
              stroke="url(#heroDnaGrad)"
              strokeWidth="1.4"

function HeroScene() {
  const rootRef = useRef(null)

  /* subtle scroll parallax — panels/particles drift at different rates */
  useEffect(() => {
    const el = rootRef.current
    if (!el) return
    let ticking = false
    const onScroll = () => {
      if (ticking) return
      ticking = true
      requestAnimationFrame(() => {
        const rect = el.getBoundingClientRect()
        const progress = Math.min(Math.max(-rect.top / (rect.height || 1), 0), 1)
        el.style.setProperty('--ephr-parallax', progress.toFixed(3))
        ticking = false
      })
    }
    window.addEventListener('scroll', onScroll, { passive: true })
    return () => window.removeEventListener('scroll', onScroll)
  }, [])

  return (
    <div className="ephr-heroscene" ref={rootRef}>
      <div className="ephr-heroscene-bg" aria-hidden="true" />
      <div className="ephr-heroscene-floor" aria-hidden="true" />
      <div className="ephr-heroscene-vignette" aria-hidden="true" />

      {/* Ambient burst on load */}
      <div className="ephr-heroscene-burst" aria-hidden="true" />

      {/* Connecting light lines from doctor to each panel */}
      <svg className="ephr-heroscene-lines" viewBox="0 0 640 520" aria-hidden="true">
        <defs>
          <linearGradient id="heroLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stopColor="#d8b4fe" stopOpacity="0.8" />
            <stop offset="100%" stopColor="#5eead4" stopOpacity="0.1" />
          </linearGradient>
        </defs>
        <path className="ephr-hero-link l1" d="M300 210 C 220 170, 160 150, 100 130" />
        <path className="ephr-hero-link l2" d="M300 210 C 380 160, 460 140, 540 110" />
        <path className="ephr-hero-link l3" d="M300 230 C 340 300, 400 340, 480 360" />
        <path className="ephr-hero-link l4" d="M290 230 C 230 300, 170 330, 110 350" />
      </svg>

      {/* Doctor silhouette, gesturing up toward the panels */}
      <div className="ephr-hero-doctor" aria-hidden="true">
        <span className="ephr-hero-doctor-glow" />
        <span className="ephr-hero-doctor-head" />
        <span className="ephr-hero-doctor-body" />
        <span className="ephr-hero-doctor-arm" />
        <span className="ephr-hero-doctor-hand" />
      </div>

      {/* Floating holographic panels */}
      {PANELS.map(({ key, label, glyph, cls }, i) => (
        <div
          key={key}
          className={`ephr-hud-panel ${cls}`}
          style={{ '--ephr-delay': `${i * 0.15}s` }}
        >
          <HudCorners />

          <div className="ephr-hud-panel-label">{label}</div>
          <div className="ephr-hud-scanline" />
        </div>
      ))}

      {/* Drifting particles */}
      {Array.from({ length: 10 }).map((_, i) => (
        <span key={i} className={`ephr-hero-particle p${i % 5}`} aria-hidden="true" />
      ))}
    </div>
  )
}

function SampleReportBook() {
  const [page, setPage] = useState(0)
  const [flip, setFlip] = useState(null) // { dir: 'next'|'prev', from, to }
  const timeoutRef = useRef(null)

  const goTo = (target) => {
    if (target === page || target < 0 || target >= PAGES.length || flip) return
    const dir = target > page ? 'next' : 'prev'
    setFlip({ dir, from: page, to: target })
    timeoutRef.current = setTimeout(() => {
      setPage(target)
      setFlip(null)
    }, 500)
  }

  const FromPage = PAGES[flip ? flip.from : page]
  const ToPage = flip ? PAGES[flip.to] : null

  return (
    <div className="sr-book-wrap">
      <div className="sr-book" style={{ perspective: '1800px' }}>
        {/* Base layer: the page underneath (destination page while flipping, else current) */}
        <div className="sr-leaf sr-leaf-base">
          {flip ? <ToPage /> : <FromPage />}
        </div>

        {/* Flipping leaf, only present during a transition */}
        {flip && (
          <div className={`sr-leaf sr-leaf-flip sr-flip-${flip.dir}`}>
            <div className="sr-leaf-face sr-leaf-front">
              <FromPage />
            </div>
            <div className="sr-leaf-face sr-leaf-back">
              <div className="sr-leaf-back-brand">recoup HEALTH</div>
            </div>
          </div>
        )}

        <div className="sr-book-shadow" />
      </div>

      <div className="sr-book-controls">
        <button
          className="sr-book-nav"
          onClick={() => goTo(page - 1)}
          disabled={page === 0 || !!flip}
          aria-label="Previous page"
        >
          &#8249;
        </button>
        <div className="sr-book-dots">
          {PAGES.map((_, i) => (
            <button
              key={i}
              className={`sr-book-dot ${i === page ? 'active' : ''}`}
              onClick={() => goTo(i)}
              aria-label={`Go to page ${i + 1}`}
            />
          ))}
        </div>
        <button
          className="sr-book-nav"
          onClick={() => goTo(page + 1)}
          disabled={page === PAGES.length - 1 || !!flip}
          aria-label="Next page"
        >
          &#8250;
        </button>
      </div>
      <p className="sr-book-caption">
        Illustrative sample with placeholder data &mdash; your actual EPHR is
        fully personalized.
      </p>
    </div>
  )
}

      </svg>
    )
  }
  if (kind === 'drop') {
    return (
      <svg viewBox="0 0 64 64" fill="none">
        {grad}
        <path
          d="M32 8c8 12 16 21.5 16 30.5C48 49.5 40.8 57 32 57S16 49.5 16 38.5C16 29.5 24 20 32 8z"

        />
        <path d="M20 40c6 8 18 8 24 0" stroke={`url(#${id})`} strokeWidth="2.4" strokeLinecap="round" opacity="0.6" />
      </svg>
    )
  }
  if (kind === 'pulse') {
    return (
      <svg viewBox="0 0 64 64" fill="none">
        {grad}
        <circle cx="32" cy="32" r="26" stroke={`url(#${id})`} strokeWidth="2" opacity="0.5" />
        <path

          strokeWidth="3"
          strokeLinecap="round"
          strokeLinejoin="round"
        />

    )
  }
  /* atom / molecule cluster */
  return (
    <svg viewBox="0 0 64 64" fill="none">
      {grad}
      <circle cx="32" cy="16" r="4.5" fill={`url(#${id})`} />

}
